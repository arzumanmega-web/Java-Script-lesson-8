<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-box">
        <div class="search-row">
            <input type="text" id="city" placeholder="City input">
            <button type="button" onclick="GetWeatherCall()">Search</button>
            <button type="button" onclick="GetWeatherLastCall()">LastSearch</button>
        </div>

        <div id="loader" class="loader-box" style="display: none;">
            <img src="loading.gif" alt="Loading" class="loader-img">
        </div>

        <div id="result"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
